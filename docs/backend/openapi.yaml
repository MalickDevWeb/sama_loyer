  /admin/annonces/{logementId}/reject:
    post:
      operationId: postAdminAnnoncesByLogementReject
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Refuser avec un motif
      parameters: [{ $ref: '#/components/parameters/LogementId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: 'Annonce refusée, bailleur notifié' }

  /admin/bailleurs/{userId}/{action}:
    post:
      operationId: postAdminBailleursByUserByAction
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Vérifier, refuser la pièce, suspendre ou rétablir un bailleur
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [verify, reject-document, suspend, reinstate] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Bailleur mis à jour }

  /admin/transactions:
    get:
      operationId: getAdminTransactions
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Transactions (filtres type, statut, période, recherche)
      parameters:
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/PaymentPurpose' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Transactions paginées }

  /admin/transactions/{paymentId}/refund:
    post:
      operationId: postAdminTransactionsByPaymentRefund
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Rembourser (permission refunds)
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: integer, description: Défaut = montant total }
                reason: { type: string }
      responses:
        '202': { description: Remboursement initié }

  /admin/reports/{reportId}/resolve:
    post:
      operationId: postAdminReportsByReportResolve
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Traiter un signalement
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend_listing_and_account, suspend_account, hide_listing, request_correction, dismiss] }
                note: { type: string }
      responses:
        '200': { description: Signalement résolu }

  /admin/settings/{section}:
    parameters:
      - { name: section, in: path, required: true, schema: { type: string, enum: [prices, rules, features] } }
    get:
      operationId: getAdminSettingsBySection
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Lire un groupe de paramètres
      responses:
        '200': { description: Paramètres }
    put:
      operationId: putAdminSettingsBySection
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Modifier un groupe de paramètres (permission settings)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Paramètres enregistrés }

  /admin/audit-logs:
    get:
      operationId: getAdminAuditLogs
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Journal d'audit
      parameters:
        - { name: module, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Entrées paginées }

# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton émis par /admin/auth/2fa (audience distincte)
    maxitSignature:
      type: apiKey
      in: header
      name: X-Maxit-Signature
      description: HMAC-SHA256 du corps brut, avec X-Maxit-Timestamp

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    AcceptLanguage: { name: Accept-Language, in: header, schema: { $ref: '#/components/schemas/Locale' } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID généré par le front, conservé 24 h côté serveur
      schema: { type: string, format: uuid }
    LogementId: { name: logementId, in: path, required: true, schema: { type: string } }
    VisiteId: { name: visiteId, in: path, required: true, schema: { type: string } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string } }
    ContratId: { name: contratId, in: path, required: true, schema: { type: string } }
    LoyerId: { name: loyerId, in: path, required: true, schema: { type: string }, description: Identifiant d'échéance }

  responses:
    ValidationError:
      description: Requête invalide (VALIDATION_ERROR)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: Non authentifié (UNAUTHENTICATED, TOKEN_EXPIRED)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Interdit (FORBIDDEN, SUBSCRIPTION_REQUIRED, BAILLEUR_SUSPENDED)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Introuvable (NOT_FOUND)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflit d'état (SLOT_UNAVAILABLE, VISIT_ALREADY_OPEN, LOGEMENT_UNAVAILABLE, TRIAL_ALREADY_USED, IDEMPOTENCY_CONFLICT, INVALID_STATE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: Règle métier non respectée (AMOUNT_BELOW_MINIMUM, AMOUNT_ABOVE_REMAINING, CONTRACT_TERMS_NOT_ACCEPTED…)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Trop de requêtes (RATE_LIMITED)
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ProviderError:
      description: Max it indisponible (PAYMENT_PROVIDER_ERROR)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SignedUrl:
      description: URL temporaire (15 min)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      expiresAt: { type: string, format: date-time }
    PaymentInitiated:
      description: Paiement créé, à confirmer dans Max it
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data:
                    type: object
                    required: [payment, checkout]
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      checkout: { $ref: '#/components/schemas/Checkout' }

  schemas:
    # --- Enveloppes -----------------------------------------------------------
    Envelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { type: object }
    Error:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, const: false }
        code: { type: string, examples: [AMOUNT_BELOW_MINIMUM] }
        message: { type: string, description: 'Prêt à afficher, dans la langue demandée' }
        details: { type: object }
        requestId: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    # --- Énumérations -------------------------------------------------------
    Locale: { type: string, enum: [fr, wo] }
    LogementType: { type: string, enum: [chambre, chambre_salon, studio, appartement, maison] }
    LogementStatus: { type: string, enum: [draft, validation, online, reserved, rented, hidden, rejected] }
    VerificationLevel: { type: string, enum: [declared, phone_verified, identity_verified, identity_and_visit_verified, certified_agency] }
    VisiteStatus: { type: string, enum: [pending, accepted, rejected, cancelled, done, no_show] }
    ContratStatus: { type: string, enum: [draft, pending_signature, active, notice, terminated, cancelled] }
    EcheanceStatus: { type: string, enum: [pending, partial, paid, late, cancelled] }
    PaymentPurpose: { type: string, enum: [entry, rent, subscription, boost, refund] }
    PaymentStatus: { type: string, enum: [pending, succeeded, failed, refunded, expired] }
    SubscriptionPlan: { type: string, enum: [trial, pro] }
    IncidentCategory: { type: string, enum: [plumbing, electricity, lock, humidity, other] }

    # --- Auth ---------------------------------------------------------------
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              type: object
              required: [accessToken, refreshToken, expiresIn, user]
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                expiresIn: { type: integer, description: Secondes (3600) }
                user: { $ref: '#/components/schemas/Me' }
    Me:
      type: object
      required: [id, fullName, phone, locale, roles]
      properties:
        id: { type: string }
        fullName: { type: string }
        phone: { type: string, examples: ['+221771234567'] }
        city: { type: [string, 'null'] }
        locale: { $ref: '#/components/schemas/Locale' }
        avatarUrl: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, enum: [locataire, bailleur] }
        bailleur:
          oneOf:
            - $ref: '#/components/schemas/BailleurAccount'
            - type: 'null'

    # --- Référentiels -------------------------------------------------------
    Zone:
      type: object
      properties:
        id: { type: string, examples: [ouakam] }
        name: { type: string }
        commune: { type: string }
        neighbours:
          type: array
          items: { type: string }
    Amenity:
      type: object
      properties:
        id: { type: string, examples: [private_toilet] }
        label: { type: string }
        icon: { type: [string, 'null'] }

    # --- Logements ----------------------------------------------------------
    LogementCard:
      type: object
      required: [id, title, type, place, zone, price, caution, avance, frais, cover, verified, status]
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/LogementType' }
        typeLabel: { type: string, description: Libellé localisé du type }
        place: { type: string, examples: ['Ouakam, Cité Avion'] }
        zone: { type: string }
        price: { type: integer, description: Loyer mensuel }
        caution: { type: integer }
        avance: { type: integer }
        frais: { type: integer }
        cover: { type: string, format: uri }
        images:
          type: array
          items: { type: string, format: uri }
        verified: { type: boolean, description: Bailleur vérifié }
        verificationLevel: { $ref: '#/components/schemas/VerificationLevel' }
        availabilityConfirmedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/LogementStatus' }
        isBoosted: { type: boolean }
        isFavorite: { type: boolean, description: false si non connecté }
        surface: { type: [integer, 'null'] }
        rooms: { type: [integer, 'null'] }
    LogementDetail:
      allOf:
        - $ref: '#/components/schemas/LogementCard'
        - type: object
          properties:
            description: { type: string }
            address: { type: [string, 'null'], description: 'Adresse précise, null si non autorisée' }
            cautionMonths: { type: integer }
            amenities:
              type: array
              items: { $ref: '#/components/schemas/Amenity' }
            media:
              type: array
              items: { $ref: '#/components/schemas/Media' }
            video:
              oneOf:
                - $ref: '#/components/schemas/Media'
                - type: 'null'
            availableFrom: { type: [string, 'null'], format: date }
            remoteVisitEnabled: { type: boolean }
            rentWithoutVisitEnabled: { type: boolean }
            bailleur:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                phone: { type: string, description: Masqué (+221 77 ••• •• 30) sauf visite acceptée ou contrat }
                verified: { type: boolean }
                memberSince: { type: string, format: date }
            myVisite:
              oneOf:
                - $ref: '#/components/schemas/Visite'
                - type: 'null'
            conversationId: { type: [string, 'null'] }
    Media:
      type: object
      properties:
        kind: { type: string, enum: [photo, video] }
        url: { type: string, format: uri }
        posterUrl: { type: [string, 'null'], format: uri }
        label: { type: [string, 'null'] }
    AssistantResult:
      type: object
      properties:
        understood:
          type: object
          description: Critères extraits de la demande
          properties:
            zone: { type: [string, 'null'] }
            type: { type: [string, 'null'] }
            maxPrice: { type: [integer, 'null'] }
            amenities: { type: array, items: { type: string } }
        results:
          type: array
          maxItems: 4
          items:
            allOf:
              - $ref: '#/components/schemas/LogementCard'
              - properties:
                  matchScore: { type: number, minimum: 0, maximum: 1 }
                  reason: { type: string, description: Pourquoi ce logement correspond }

    # --- Visites ------------------------------------------------------------
    Visite:
      type: object
      required: [id, logementId, scheduledAt, status]
      properties:
        id: { type: string }
        logementId: { type: string }
        logementTitle: { type: string }
        logementPlace: { type: string }
        price: { type: integer }
        cover: { type: string, format: uri }
        scheduledAt: { type: string, format: date-time }
        date: { type: string, format: date, description: Compatibilité VisiteSchema }
        time: { type: string, examples: ['16:00'] }
        isRemote: { type: boolean }
        status: { $ref: '#/components/schemas/VisiteStatus' }
        message: { type: [string, 'null'], description: Message du locataire }
        note: { type: [string, 'null'], description: Réponse du bailleur (consignes ou motif de refus) }
        address: { type: [string, 'null'], description: Rempli si accepted }
        landlordName: { type: string }
        landlordPhone: { type: string }
        tenantName: { type: string }
        tenantPhone: { type: string }
        conversationId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    VisitSchedule:
      type: object
      required: [weekly, blockedDays]
      properties:
        weekly:
          type: array
          description: Créneaux d'1 h par jour ISO (1 = lundi)
          items:
            type: object
            required: [weekday, slots]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              slots:
                type: array
                items: { type: string, pattern: '^\d{2}:\d{2}$' }
        blockedDays:
          type: array
          items: { type: string, format: date }
        remoteVisitEnabled: { type: boolean }

    # --- Messagerie ---------------------------------------------------------
    Conversation:
      type: object
      properties:
        id: { type: string }
        logement:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            place: { type: string }
            price: { type: integer }
            cover: { type: string, format: uri }
            status: { $ref: '#/components/schemas/LogementStatus' }
        counterpart:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            initials: { type: string }
            kind: { type: string, enum: [bailleur, candidat, locataire], description: candidat = pas encore de contrat }
        lastMessage: { type: [string, 'null'] }
        lastMessageAt: { type: string, format: date-time }
        unread: { type: integer }
        visite:
          oneOf:
            - $ref: '#/components/schemas/Visite'
            - type: 'null'
    Message:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [text, voice, event] }
        fromMe: { type: boolean }
        text: { type: [string, 'null'] }
        audioUrl: { type: [string, 'null'], format: uri }
        eventType: { type: [string, 'null'], enum: [visit_requested, visit_accepted, visit_rejected, visit_cancelled, contract_signed, entry_paid, rent_paid, notice_given, null] }
        eventPayload: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }

    # --- Contrats -----------------------------------------------------------
    ContratSummary:
      type: object
      properties:
        id: { type: string }
        numero: { type: string, examples: [SL-2026-10-0412] }
        status: { $ref: '#/components/schemas/ContratStatus' }
        logementId: { type: string }
        logementTitle: { type: string }
        logementPlace: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        rent: { type: integer }
    Contrat:
      allOf:
        - $ref: '#/components/schemas/ContratSummary'
        - type: object
          properties:
            caution: { type: integer }
            cautionMonths: { type: integer }
            avance: { type: integer }
            frais: { type: integer }
            dueDay: { type: integer, examples: [5] }
            durationMonths: { type: integer }
            minDurationMonths: { type: integer }
            noticeMonths: { type: integer }
            autoRenew: { type: boolean }
            utilitiesNote: { type: [string, 'null'] }
            bailleur: { $ref: '#/components/schemas/ContratParty' }
            locataire: { $ref: '#/components/schemas/ContratParty' }
            articles:
              type: array
              description: Texte figé, rendu avec les montants réels
              items:
                type: object
                required: [title, text]
                properties:
                  key: { type: string }
                  title: { type: string }
                  hint: { type: string }
                  text: { type: string }
            contentHash: { type: string, description: SHA-256 du contenu à signer }
            depositStatus: { type: string, enum: [not_paid, held, refunded, partially_refunded] }
            entryEcheanceId: { type: string }
            keysHandedOverAt: { type: [string, 'null'], format: date-time }
            issueWindowEndsAt: { type: [string, 'null'], format: date-time }
            noticeGivenAt: { type: [string, 'null'], format: date-time }
            departureDate: { type: [string, 'null'], format: date }
            conversationId: { type: [string, 'null'] }
    ContratParty:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        verification: { type: string, examples: ['Identité vérifiée'] }
        signatureName: { type: [string, 'null'] }
        signedAt: { type: [string, 'null'], format: date-time }
    EntrySummary:
      type: object
      properties:
        echeanceId: { type: string }
        avance: { type: integer }
        caution: { type: integer }
        frais: { type: integer }
        total: { type: integer }
        minFirstPayment: { type: integer }
        dueDate: { type: string, format: date }
    NoticeRequest:
      type: object
      required: [departureDate]
      properties:
        departureDate: { type: string, format: date, description: '≥ aujourd''hui + préavis' }
        reason: { type: string, maxLength: 500 }
    Incident:
      type: object
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/IncidentCategory' }
        description: { type: string }
        photoUrls: { type: array, items: { type: string, format: uri } }
        isMoveInIssue: { type: boolean }
        status: { type: string, enum: [open, in_progress, resolved] }
        createdAt: { type: string, format: date-time }

    # --- Loyers, paiements, quittances --------------------------------------
    Loyer:
      type: object
      description: Échéance (compatible LoyerSchema du front)
      required: [id, kind, contratId, homeId, amount, paidAmount, status, dueDate]
      properties:
        id: { type: string }
        kind: { type: string, enum: [entry, rent] }
        contratId: { type: string }
        homeId: { type: string }
        homeName: { type: string }
        homeAddress: { type: string }
        owner: { type: string }
        ownerPhone: { type: string }
        conversationId: { type: [string, 'null'] }
        month: { type: [string, 'null'], examples: ['2026-11'], description: null pour l'entrée }
        dueDate: { type: string, format: date }
        amount: { type: integer, description: Montant dû }
        paidAmount: { type: integer }
        minFirstPayment: { type: [integer, 'null'], description: Entrée uniquement }
        status: { $ref: '#/components/schemas/EcheanceStatus' }
        paidAt: { type: [string, 'null'], format: date-time }
        tranches:
          type: array
          items:
            type: object
            properties:
              paymentId: { type: string }
              amount: { type: integer }
              method: { type: string, enum: [maxit, cash] }
              paidAt: { type: string, format: date-time }
              receiptNumber: { type: string }
        receiptNumber: { type: [string, 'null'], description: Quittance finale }
        pdfUrl: { type: [string, 'null'], format: uri }
    Payment:
      type: object
      required: [id, reference, purpose, amount, method, status]
      properties:
        id: { type: string }
        reference: { type: string, examples: [TX-26-10-4821] }
        purpose: { $ref: '#/components/schemas/PaymentPurpose' }
        label: { type: string, examples: ['Loyer de novembre · Mon studio'] }
        amount: { type: integer }
        method: { type: string, enum: [maxit, cash] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        failureReason: { type: [string, 'null'] }
        initiatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        echeance:
          type: [object, 'null']
          properties:
            id: { type: string }
            amountDue: { type: integer }
            amountPaid: { type: integer }
            status: { $ref: '#/components/schemas/EcheanceStatus' }
        quittance:
          type: [object, 'null']
          properties:
            id: { type: string }
            numero: { type: string }
            isFinal: { type: boolean }
    Checkout:
      type: object
      required: [provider, payToken]
      properties:
        provider: { type: string, const: maxit }
        payToken: { type: string, description: À transmettre à l'API de paiement Max it }
        deeplink: { type: [string, 'null'] }
    Quittance:
      type: object
      properties:
        id: { type: string }
        numero: { type: string, examples: [REC-NOV-2026-008812] }
        contratId: { type: string }
        contratNumero: { type: string }
        echeanceId: { type: string }
        period: { type: [string, 'null'], examples: ['2026-11'] }
        amount: { type: integer }
        breakdown:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { type: integer }
        isFinal: { type: boolean }
        method: { type: string, enum: [maxit, cash] }
        paymentReference: { type: string }
        logementTitle: { type: string }
        logementAddress: { type: string }
        bailleurName: { type: string }
        locataireName: { type: string }
        issuedAt: { type: string, format: date-time }
        verifyCode: { type: string }
        verifyUrl: { type: string, format: uri }

    # --- Bailleur -----------------------------------------------------------
    BailleurAccount:
      type: object
      properties:
        status: { type: string, enum: [not_activated, active, expired, suspended] }
        plan: { oneOf: [{ $ref: '#/components/schemas/SubscriptionPlan' }, { type: 'null' }] }
        endsAt: { type: [string, 'null'], format: date-time }
        canStartTrial: { type: boolean }
        verificationStatus: { type: string, enum: [pending, active, suspended, rejected] }
        boosts:
          type: array
          items:
            type: object
            properties:
              logementId: { type: string }
              plan: { type: string, enum: [boost7, boost30] }
              endsAt: { type: string, format: date-time }
        prices:
          type: object
          description: Tarifs en vigueur (app_settings.prices)
          properties:
            pro: { type: integer, examples: [15000] }
            boost7: { type: integer, examples: [1500] }
            boost30: { type: integer, examples: [6000] }
    AnnonceInput:
      type: object
      required: [title, type, zone, price, caution, avance, photos]
      properties:
        title: { type: string, minLength: 3, maxLength: 80 }
        type: { $ref: '#/components/schemas/LogementType' }
        zone: { type: string }
        placeLabel: { type: string, description: Défaut = nom de la zone + addressDetail résumé }
        addressDetail: { type: string, maxLength: 200 }
        price: { type: integer, minimum: 1 }
        caution: { type: integer, minimum: 0 }
        avance: { type: integer, minimum: 1 }
        frais: { type: integer, minimum: 0, default: 0 }
        surface: { type: integer, minimum: 1 }
        rooms: { type: integer, minimum: 1 }
        amenities: { type: array, items: { type: string } }
        description: { type: string, maxLength: 1500 }
        photos:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri }
        video:
          type: [object, 'null']
          properties:
            url: { type: string, format: uri }
            posterUrl: { type: string, format: uri }
        availableFrom: { type: string, format: date }
        remoteVisitEnabled: { type: boolean }
        rentWithoutVisitEnabled: { type: boolean }
    AnnoncePatch:
      type: object
      description: Tous les champs de AnnonceInput, optionnels
      properties:
        title: { type: string }
        price: { type: integer }
        caution: { type: integer }
        avance: { type: integer }
        frais: { type: integer }
        amenities: { type: array, items: { type: string } }
        description: { type: string }
        photos: { type: array, items: { type: string, format: uri } }
        availableFrom: { type: string, format: date }
    BailleurAnnonce:
      allOf:
        - $ref: '#/components/schemas/LogementCard'
        - type: object
          properties:
            views: { type: integer }
            pendingVisitRequests: { type: integer }
            needsAvailabilityConfirmation: { type: boolean }
            rejectionReason: { type: [string, 'null'] }
            moderationFlags:
              type: array
              items: { type: string, examples: [phone_in_description, price_far_below_median, few_photos] }
            boostEndsAt: { type: [string, 'null'], format: date-time }
            currentContratId: { type: [string, 'null'] }
    BailleurLocataire:
      type: object
      properties:
        contratId: { type: string }
        locataire:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            initials: { type: string }
            phone: { type: string }
        logement:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            place: { type: string }
            price: { type: integer }
        since: { type: string, format: date }
        cautionHeld: { type: integer }
        currentEcheance:
          oneOf:
            - $ref: '#/components/schemas/Loyer'
            - type: 'null'
        rentStatus: { type: string, enum: [paid, pending, late] }
        contratStatus: { $ref: '#/components/schemas/ContratStatus' }
        conversationId: { type: [string, 'null'] }
