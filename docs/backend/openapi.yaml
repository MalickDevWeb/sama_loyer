  # ==========================================================================
  # TRANSVERSE
  # ==========================================================================
  /uploads:
    post:
      operationId: postUploads
      tags: [Transverse]
      summary: Obtenir une URL d'envoi pré-signée (Tencent COS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, size]
              properties:
                kind: { type: string, enum: [logement_photo, logement_video, video_poster, message_audio, incident_photo, id_document, avatar] }
                contentType: { type: string, examples: ['image/jpeg'] }
                size: { type: integer, minimum: 1, description: Octets }
      responses:
        '200':
          description: URL d'envoi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [uploadUrl, fileUrl, expiresAt]
                        properties:
                          uploadUrl: { type: string, format: uri }
                          method: { type: string, const: PUT }
                          headers: { type: object, additionalProperties: { type: string } }
                          fileUrl: { type: string, format: uri, description: À renvoyer dans l'annonce / le message }
                          expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }

  /reports:
    post:
      operationId: postReports
      tags: [Transverse]
      summary: Signaler une annonce ou un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, enum: [logement, user] }
                targetId: { type: string }
                reason: { type: string, enum: [money_before_visit, fake_listing, already_rented, photos_mismatch, harassment, other] }
                detail: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Signalement enregistré }

  /webhooks/maxit:
    post:
      operationId: postWebhooksMaxit
      tags: [Paiements]
      summary: Notification de paiement Max it / Orange Money (serveur à serveur)
      security:
        - maxitSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerRef, merchantReference, status, amount]
              properties:
                providerRef: { type: string }
                merchantReference: { type: string, description: Payment.reference (TX-…) }
                status: { type: string, enum: [SUCCESS, FAILED, CANCELLED] }
                amount: { type: integer }
                currency: { type: string, const: XOF }
                payerMsisdn: { type: string }
                occurredAt: { type: string, format: date-time }
      responses:
        '200': { description: Pris en compte (idempotent sur providerRef) }
        '401': { description: Signature invalide }

  /health:
    get:
      operationId: getHealth
      tags: [Transverse]
      summary: Supervision
      security: []
      responses:
        '200': { description: OK }

