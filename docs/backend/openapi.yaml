openapi: 3.1.0
info:
  title: SAMA LOYER API
  version: 1.0.0
  summary: Location simplifiée au Sénégal, dans Max it.
  description: |
    Contrat d'API du mini-programme SAMA LOYER (locataire + bailleur) et du back office.
    Conventions, flux et règles métier : docs/backend/02-contrat-api.md.
    Modèle de données : docs/backend/01-modele-de-donnees.md et schema.sql.

    Toutes les réponses utilisent l'enveloppe `{ success, data, meta? }` en succès
    et `{ success: false, code, message, details?, requestId }` en erreur.
    Montants en entiers XOF. Dates ISO 8601 UTC.
servers:
  - url: https://api.samaloyer.sn/api/v1
    description: Production
  - url: https://api-staging.samaloyer.sn/api/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Référentiels
  - name: Logements
  - name: Recherche
  - name: Favoris
  - name: Visites
  - name: Messagerie
  - name: Location
  - name: Loyers
  - name: Paiements
  - name: Quittances
  - name: Bailleur
  - name: Bailleur · Annonces
  - name: Bailleur · Visites
  - name: Bailleur · Locataires
  - name: Transverse
  - name: Admin

paths:
  # ==========================================================================
  # AUTH
  # ==========================================================================
  /auth/maxit:
    post:
      operationId: postAuthMaxit
      tags: [Auth]
      summary: Échanger le code d'autorisation Max it contre une session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authCode]
              properties:
                authCode: { type: string, description: Code à usage unique fourni par Max it (valide 5 min) }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '502': { $ref: '#/components/responses/ProviderError' }

  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [Auth]
      summary: Renouveler les jetons (rotation du refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nouveaux jetons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: Révoquer le refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Déconnecté }

  /me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Profil de l'utilisateur connecté
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      operationId: patchMe
      tags: [Auth]
      summary: Modifier les préférences (le nom et le numéro viennent de Max it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city: { type: string, maxLength: 60 }
                locale: { $ref: '#/components/schemas/Locale' }
                avatarUrl: { type: string, format: uri }
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/unread-counts:
    get:
      operationId: getMeUnreadCounts
      tags: [Messagerie]
      summary: Messages non lus (badges des onglets)
      responses:
        '200':
          description: Compteurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          locataire: { type: integer, minimum: 0 }
                          bailleur: { type: integer, minimum: 0 }

  # ==========================================================================
  # RÉFÉRENTIELS
  # ==========================================================================
  /zones:
    get:
      operationId: getZones
      tags: [Référentiels]
      summary: Quartiers actifs et leurs voisins
      security: []
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Zone' }

  /amenities:
    get:
      operationId: getAmenities
      tags: [Référentiels]
      summary: Équipements (libellés dans la langue demandée)
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Équipements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Amenity' }

  # ==========================================================================
  # LOGEMENTS & RECHERCHE
  # ==========================================================================
  /logements:
    get:
      operationId: getLogements
      tags: [Logements]
      summary: Rechercher des logements visibles
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: zone, in: query, schema: { type: string }, description: Slug de zone (ex. ouakam) }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Texte libre (titre, quartier)' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/LogementType' } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: verifiedOnly, in: query, schema: { type: boolean, default: false } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, price_asc, price_desc, recent], default: relevance } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Résultats (les logements boostés du quartier sont en tête)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogementCard' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - properties:
                              suggestedZones:
                                type: array
                                items: { type: string }
                                description: Quartiers voisins, rempli si moins de 3 résultats

  /logements/{logementId}:
    get:
      operationId: getLogementsByLogement
      tags: [Logements]
      summary: Fiche détaillée d'un logement
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/LogementId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Fiche (adresse précise et numéro complet seulement si visite acceptée ou contrat)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/LogementDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /logements/{logementId}/visit-slots:
    get:
      operationId: getLogementsByLogementVisitSlots
      tags: [Visites]
      summary: Créneaux de visite libres
      security: []
      parameters:
        - $ref: '#/components/parameters/LogementId'
        - { name: from, in: query, schema: { type: string, format: date }, description: Défaut aujourd'hui }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 16 } }
      responses:
        '200':
          description: Créneaux par jour (un jour sans créneau est fermé)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          remoteVisitEnabled: { type: boolean }
                          days:
                            type: array
                            items:
                              type: object
                              required: [date, slots]
                              properties:
                                date: { type: string, format: date }
                                slots:
                                  type: array
                                  items: { type: string, pattern: '^\d{2}:\d{2}$', examples: ['16:00'] }
        '404': { $ref: '#/components/responses/NotFound' }

  /logements/{logementId}/locations:
    post:
      operationId: postLogementsByLogementLocations
      tags: [Location]
      summary: Démarrer une location (crée le contrat à signer et l'échéance d'entrée)
      parameters:
        - $ref: '#/components/parameters/LogementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate]
              properties:
                startDate: { type: string, format: date }
                durationMonths: { type: integer, minimum: 6, maximum: 36, default: 12 }
                viaVisitId: { type: string, description: Absent = parcours « Louer sans visite » }
      responses:
        '201':
          description: Contrat en attente de signature
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          contrat: { $ref: '#/components/schemas/ContratSummary' }
                          entry: { $ref: '#/components/schemas/EntrySummary' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /search/assistant:
    post:
      operationId: postSearchAssistant
      tags: [Recherche]
      summary: Recherche IA en langage naturel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 500, examples: ['Une chambre salon à Ouakam, 60 000 maximum, avec toilettes privées'] }
                zone: { type: string }
                maxPrice: { type: integer }
      responses:
        '200':
          description: 3 à 4 logements classés
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AssistantResult' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /search/voice:
    post:
      operationId: postSearchVoice
      tags: [Recherche]
      summary: Recherche vocale (wolof ou français)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: 'mp3/aac/m4a, 60 s et 2 Mo max' }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Transcription et résultats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AssistantResult'
                          - properties:
                              transcript: { type: string }
                              detectedLocale: { $ref: '#/components/schemas/Locale' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/favoris:
    get:
      operationId: getMeFavoris
      tags: [Favoris]
      summary: Mes logements favoris
      responses:
        '200':
          description: Favoris
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogementCard' }

  /me/favoris/{logementId}:
    parameters:
      - $ref: '#/components/parameters/LogementId'
    put:
      operationId: putMeFavorisByLogement
      tags: [Favoris]
      summary: Ajouter aux favoris (idempotent)
      responses:
        '204': { description: Ajouté }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMeFavorisByLogement
      tags: [Favoris]
      summary: Retirer des favoris (idempotent)
      responses:
        '204': { description: Retiré }

  # ==========================================================================
  # VISITES (LOCATAIRE)
  # ==========================================================================
  /visites:
    get:
      operationId: getVisites
      tags: [Visites]
      summary: Mes demandes de visite
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VisiteStatus' } }
      responses:
        '200':
          description: Visites (plus récentes d'abord)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Visite' }
    post:
      operationId: postVisites
      tags: [Visites]
      summary: Demander une visite
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logementId, scheduledAt]
              properties:
                logementId: { type: string }
                scheduledAt: { type: string, format: date-time }
                message: { type: string, maxLength: 500 }
                isRemote: { type: boolean, default: false }
      responses:
        '201':
          description: Demande envoyée (pending)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Visite' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /visites/{visiteId}/cancel:
    post:
      operationId: postVisitesByVisiteCancel
      tags: [Visites]
      summary: Annuler ma demande
      parameters:
        - $ref: '#/components/parameters/VisiteId'
      responses:
        '200':
          description: Visite annulée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Visite' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ==========================================================================
  # MESSAGERIE
  # ==========================================================================
  /conversations:
    get:
      operationId: getConversations
      tags: [Messagerie]
      summary: Mes conversations
      parameters:
        - { name: as, in: query, required: true, schema: { type: string, enum: [locataire, bailleur] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Conversations (dernier message en premier)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Conversation' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      operationId: postConversations
      tags: [Messagerie]
      summary: Ouvrir (ou retrouver) la conversation d'un logement et envoyer un 1er message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logementId, text]
              properties:
                logementId: { type: string }
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Conversation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getConversationsByConversationMessages
      tags: [Messagerie]
      summary: Historique (curseur)
      parameters:
        - { name: before, in: query, schema: { type: string }, description: Messages plus anciens que cet id }
        - { name: after, in: query, schema: { type: string }, description: Messages plus récents que cet id (polling) }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Messages, du plus ancien au plus récent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
                      meta:
                        type: object
                        properties:
                          nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: postConversationsByConversationMessages
      tags: [Messagerie]
      summary: Envoyer un message (texte ou vocal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
                audioUrl: { type: string, format: uri }
              oneOf:
                - required: [text]
                - required: [audioUrl]
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Message' }

  /conversations/{conversationId}/read:
    post:
      operationId: postConversationsByConversationRead
      tags: [Messagerie]
      summary: Marquer la conversation comme lue
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204': { description: Lu }

  # ==========================================================================
  # CONTRATS
  # ==========================================================================
  /contrats:
    get:
      operationId: getContrats
      tags: [Location]
      summary: Mes contrats (locataire)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContratStatus' } }
      responses:
        '200':
          description: Contrats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContratSummary' }

  /contrats/{contratId}:
    get:
      operationId: getContratsByContrat
      tags: [Location]
      summary: Contrat complet (texte figé)
      parameters:
        - $ref: '#/components/parameters/ContratId'
      responses:
        '200':
          description: Contrat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Contrat' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contrats/{contratId}/sign:
    post:
      operationId: postContratsByContratSign
      tags: [Location]
      summary: Signature du locataire
      parameters:
        - $ref: '#/components/parameters/ContratId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptTerms, signatureName, contentHash]
              properties:
                acceptTerms: { type: boolean, const: true }
                signatureName: { type: string, minLength: 2, maxLength: 80 }
                contentHash: { type: string, description: Doit égaler Contrat.contentHash }
      responses:
        '200':
          description: Contrat signé par le locataire
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Contrat' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /contrats/{contratId}/pdf:
    get:
      operationId: getContratsByContratPdf
      tags: [Location]
      summary: URL signée du PDF du contrat
      parameters:
        - $ref: '#/components/parameters/ContratId'
      responses:
        '200': { $ref: '#/components/responses/SignedUrl' }

  /contrats/{contratId}/notice:
    post:
      operationId: postContratsByContratNotice
      tags: [Location]
      summary: Donner le préavis (locataire)
      parameters:
        - $ref: '#/components/parameters/ContratId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeRequest' }
      responses:
        '200':
          description: Contrat en préavis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Contrat' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /contrats/{contratId}/incidents:
    parameters:
      - $ref: '#/components/parameters/ContratId'
    get:
      operationId: getContratsByContratIncidents
      tags: [Location]
      summary: Problèmes signalés sur ce logement
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Incident' }
    post:
      operationId: postContratsByContratIncidents
      tags: [Location]
      summary: Signaler un problème dans le logement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category: { $ref: '#/components/schemas/IncidentCategory' }
                description: { type: string, maxLength: 1000 }
                photoUrls:
                  type: array
                  maxItems: 5
                  items: { type: string, format: uri }
      responses:
        '201':
          description: Incident créé (le bailleur est notifié)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Incident' }

  # ==========================================================================
  # LOYERS & PAIEMENTS
  # ==========================================================================
  /loyers:
    get:
      operationId: getLoyers
      tags: [Loyers]
      summary: Mes échéances (entrée + loyers)
      parameters:
        - { name: contratId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EcheanceStatus' } }
      responses:
        '200':
          description: Échéances (la plus récente d'abord)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Loyer' }

  /loyers/{loyerId}:
    get:
      operationId: getLoyersByLoyer
      tags: [Loyers]
      summary: Une échéance et ses tranches
      parameters:
        - $ref: '#/components/parameters/LoyerId'
      responses:
        '200':
          description: Échéance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Loyer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /loyers/{loyerId}/pay:
    post:
      operationId: postLoyersByLoyerPay
      tags: [Paiements]
      summary: Payer une échéance (totalité ou tranche) avec Max it
      description: |
        Entrée : le 1er paiement doit être ≥ minFirstPayment (l'avance).
        Toute tranche doit être ≤ reste dû. Le statut final arrive par webhook ;
        le front interroge GET /payments/{paymentId}.
      parameters:
        - $ref: '#/components/parameters/LoyerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
                method: { type: string, enum: [maxit], default: maxit }
      responses:
        '202': { $ref: '#/components/responses/PaymentInitiated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/ProviderError' }

